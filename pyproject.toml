[project]
name = "first-1000-primes"
version = "0.1.0"
description = "Plot the first 1,000 prime numbers."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
]

[project.scripts]
first-1000-primes = "first_1000_primes:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["first_1000_primes"]